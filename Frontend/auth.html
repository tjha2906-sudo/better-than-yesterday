<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Better Than Yesterday — Account</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,300;9..144,400;9..144,500;9..144,600&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

<link rel="stylesheet" href="style.css">
<link rel="stylesheet" href="auth.css">

</head>

<body class="auth-body">

<div class="auth-ambient"></div>

<a href="index.html" class="auth-mark">
    Better Than Yesterday
</a>


<main class="auth-wrap">

<div class="auth-card">

<div class="auth-tabs">

<button class="auth-tab is-active"
        id="tabLogin"
        type="button">
    Log in
</button>

<button class="auth-tab"
        id="tabRegister"
        type="button">
    Create account
</button>

<span class="auth-tab-indicator"
      id="tabIndicator">
</span>

</div>


<form id="loginForm"
      class="auth-form">

<h1 class="auth-title">
    Welcome back.
</h1>

<p class="auth-sub">
    Pick up where yesterday left off.
</p>


<label class="field">

<span>Username</span>

<input
    name="username"
    required
    autocomplete="username"
>

</label>


<label class="field">

<span>Password</span>

<input
    name="password"
    type="password"
    required
    minlength="6"
    autocomplete="current-password"
>

</label>


<p class="field-error"
   id="loginError">
</p>


<button
    type="submit"
    class="btn btn-primary btn-full">

    <span class="btn-text">
        Log in
    </span>

    <span class="btn-spinner"></span>

</button>

</form>


<form id="registerForm"
      class="auth-form"
      hidden>

<h1 class="auth-title">
    Start your journey.
</h1>

<p class="auth-sub">
    One percent better begins with one account.
</p>


<label class="field">

<span>Username</span>

<input
    name="username"
    required
    minlength="3"
>

</label>


<label class="field">

<span>Email</span>

<input
    name="email"
    type="email"
    required
>

</label>


<label class="field">

<span>Password</span>

<input
    name="password"
    type="password"
    required
    minlength="6"
>

</label>


<label class="field">

<span>Confirm password</span>

<input
    name="confirm"
    type="password"
    required
    minlength="6"
>

</label>


<p class="field-error"
   id="registerError">
</p>


<button
    type="submit"
    class="btn btn-primary btn-full">

    <span class="btn-text">
        Create account
    </span>

    <span class="btn-spinner"></span>

</button>

</form>


<div class="auth-success"
     id="authSuccess"
     hidden>

<div class="success-orb"></div>

<h1 class="auth-title">
    You're in.
</h1>

<p class="auth-sub"
   id="successMessage">
</p>

<a href="dashboard.html"
   class="btn btn-primary btn-full">
    Go to dashboard
</a>

</div>

</div>

</main>


<script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/gsap.min.js"></script>

<script src="config.js"></script>
<script src="auth.js?v=2"></script>

</body>
</html>
